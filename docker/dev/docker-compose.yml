name: lin_open_factory_dev

services:
  db:
    image: postgres:18.4-alpine
    container_name: lin-open-factory-dev-db
    networks:
      - lin-open-factory-dev-network
    env_file:
      - ./env/db.env
    # Reached by the UI server, which runs on the host
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ../init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP and on the database of the UI server: not ready while init_db.sql runs on the temporary init server
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$UI_DATABASE_NAME -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 5

  auth:
    image: lemonldapng/lemonldap-ng:2.23
    container_name: lin-open-factory-dev-lemon
    networks:
      - lin-open-factory-dev-network
    env_file:
      - ./env/lemon.env
      - ./env/dev.env
    # Portal served over HTTPS (ssl.conf), as expected by server/server-config.json
    ports:
      - 8080:443
    volumes:
      - ./resources/llng/conf:/var/lib/lemonldap-ng/conf
      - ./resources/ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./resources/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./resources/server.key:/etc/nginx/ssl/server.key:ro
      - ./resources/oidc.key:/etc/keys/oidc.key:ro
      - ./resources/oidc.pub:/etc/keys/oidc.pub:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate --spider -q --header=\"Host: $$SSODOMAIN\" \"http://127.0.0.1/checkstate?secret=$$LEMONLDAP_CHECKSTATE_SECRET\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

networks:
  lin-open-factory-dev-network:
    name: lin-open-factory-dev-network
    driver: bridge
